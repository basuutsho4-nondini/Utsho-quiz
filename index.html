<script>
function shuffleArray(arr){
    let array = [...arr];

    for(let i = array.length - 1; i > 0; i--){
        let j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
    }

    return array;
}

/* 🔥 Question + Option shuffle system */
function shuffleQuestions(arr){
    return shuffleArray(arr).map(q => {
        let correctAnswer = q.a[q.c];

        let shuffledOptions = shuffleArray(q.a);

        return {
            q: q.q,
            a: shuffledOptions,
            c: shuffledOptions.indexOf(correctAnswer)
        };
    });
}

 { q: "১০, ১২, ১৫, ১২ এর প্রচুরক কোনটি?", a: ["১০", "১২", "১৫", "১১"], c: 1 }
];
    
const allQuestions = {
    bangla,
    english,
    physics,
    chemistry,
    biology,
    ict,
    bgs,
    math
};

let currentSubject = "";
let currentData = [];
let currentQuestion = 0;
let score = 0;
let timeLeft = 15;
let timer;

/* START QUIZ */
function startQuiz(subject){
    currentSubject = subject;

    currentData = shuffleQuestions(allQuestions[subject]);

    currentQuestion = 0;
    score = 0;

    document.getElementById("menu").style.display = "none";
    document.getElementById("quizBox").style.display = "block";

   
    document.getElementById("title").style.display = "none";
    document.getElementById("subtitle").style.display = "none";

    document.getElementById("subjectTitle").innerText =
    "Subject: " + subject.toUpperCase();

    loadQuestion();
}

/* 🔙 BACK TO MENU */
function goBack(){
    document.getElementById("quizBox").style.display = "none";
    document.getElementById("menu").style.display = "block";

    document.getElementById("title").style.display = "block";
    document.getElementById("subtitle").style.display = "block";

    clearInterval(timer); // 🔥 extra safety
}

/* LOAD QUESTION */
function loadQuestion(){

    clearInterval(timer);
    timeLeft = 15;

    let q = currentData[currentQuestion];
        
    document.getElementById("question").innerHTML = q.q;

    let html = "";

    q.a.forEach((opt,i)=>{
        html += `<button onclick="checkAnswer(${i})">${opt}</button><br>`;
    });

    document.getElementById("options").innerHTML = html;
    document.getElementById("result").innerText = "";

    timer = setInterval(()=>{
        document.getElementById("timer").innerText = "Time: " + timeLeft;
        timeLeft--;

        if(timeLeft < 0){
            clearInterval(timer);
            showAnswer();
            setTimeout(nextQuestion,3000);
        }
    },1000);
}

/* CHECK ANSWER */
function checkAnswer(i){
    clearInterval(timer);

    let correct = currentData[currentQuestion].c;
    let buttons = document.querySelectorAll("#options button");

    buttons.forEach(btn => btn.disabled = true);

    if(i === correct){
        score += 1;
        buttons[i].style.background = "green";
        document.getElementById("result").innerText = "✔ Correct!";
    } else {
        buttons[i].style.background = "red";
        buttons[correct].style.background = "green";
        document.getElementById("result").innerText =
        "❌ Wrong! Correct: " + currentData[currentQuestion].a[correct];
    }

    document.getElementById("score").innerText = "Score: " + score;

    setTimeout(nextQuestion,3000);
}

/* SHOW ANSWER */
function showAnswer(){
    let correct = currentData[currentQuestion].c;
    let buttons = document.querySelectorAll("#options button");

    buttons.forEach(btn => btn.disabled = true);

    buttons[correct].style.background = "green";

    document.getElementById("result").innerText =
    "⏰ Time Up! Correct: " + currentData[currentQuestion].a[correct];
}

/* NEXT QUESTION */
function nextQuestion(){

    currentQuestion++;

    if(score >= 50){
        alert("🎉 You Win!");
        location.reload();
        return;
    }

    if(currentQuestion >= currentData.length){
        alert("Quiz Finished! Score: " + score);
        location.reload();
        return;
    }

    loadQuestion();
}
</script>
