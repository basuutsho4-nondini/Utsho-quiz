<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Utsho Kingdom Quiz</title>

<style>
body{
    font-family: Arial;
    background: linear-gradient(to right,#0f2027,#203a43,#2c5364);
    color:white;
    text-align:center;
}

h1{color:gold;}

.container{
    max-width:650px;
    margin:auto;
    background:rgba(0,0,0,0.7);
    padding:20px;
    border-radius:15px;
}

button{
    width:100%;
    padding:10px;
    margin:5px;
    border:none;
    border-radius:8px;
    background:#00c6ff;
}

button:hover{
    background:#0072ff;
    color:white;
}
</style>

</head>

<body>

<h1>👑 Utsho's Kingdom 👑</h1>

<div class="container">

<div id="menu">
<h2>Select Subject</h2>
<button onclick="startQuiz('physics')">Physics</button>
<button onclick="startQuiz('chemistry')">Chemistry</button>
<button onclick="startQuiz('bangla')">Bangla</button>
<button onclick="startQuiz('english')">English</button>
</div>

<div id="quiz" style="display:none;">
<h3 id="progress"></h3>
<div id="question"></div>
<div id="answers"></div>
<div id="result"></div>
<h3>Score: <span id="score">0</span></h3>
</div>

</div>

<script>

let questions = [];
let index = 0;
let score = 0;

function startQuiz(subject){

fetch("questions.json")
.then(res => res.json())
.then(data => {

questions = data[subject].sort(()=>0.5 - Math.random());

document.getElementById("menu").style.display="none";
document.getElementById("quiz").style.display="block";

index=0;
score=0;

loadQuestion();

});

}

function loadQuestion(){

if(index >= questions.length){
document.getElementById("question").innerHTML="Quiz Finished!";
return;
}

if(score>=20){
document.getElementById("question").innerHTML="🏆 YOU WIN!";
document.getElementById("answers").innerHTML="";
return;
}

let q = questions[index];

document.getElementById("progress").innerText = "Question "+(index+1);
document.getElementById("question").innerText=q.q;

let ansDiv=document.getElementById("answers");
ansDiv.innerHTML="";

q.a.forEach((ans,i)=>{
let btn=document.createElement("button");
btn.innerText=ans;
btn.onclick=()=>checkAnswer(i);
ansDiv.appendChild(btn);
});
}

function checkAnswer(i){

let q = questions[index];

if(i===q.c){
score++;
document.getElementById("result").innerText="✅ সঠিক";
}else{
document.getElementById("result").innerText="❌ ভুল! "+q.a[q.c];
}

document.getElementById("score").innerText=score;

index++;

setTimeout(()=>{
document.getElementById("result").innerText="";
loadQuestion();
},1000);

}

</script>

</body>
</html>
