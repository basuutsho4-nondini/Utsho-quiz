<script>
function shuffleArray(arr){
    let array = [...arr];

    for(let i = array.length - 1; i > 0; i--){
        let j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
    }

    return array;
}

/* 🔥 Question + Option shuffle system */
function shuffleQuestions(arr){
    return shuffleArray(arr).map(q => {
        let correctAnswer = q.a[q.c];

        let shuffledOptions = shuffleArray(q.a);

        return {
            q: q.q,
            a: shuffledOptions,
            c: shuffledOptions.indexOf(correctAnswer)
        };
    });
}

const allQuestions = {
    bangla,
    english,
    physics,
    chemistry
};

let currentSubject = "";
let currentData = [];
let currentQuestion = 0;
let score = 0;
let timeLeft = 10;
let timer;

/* START QUIZ */
function startQuiz(subject){
    currentSubject = subject;

    currentData = shuffleQuestions(allQuestions[subject]); // 🔥 random

    currentQuestion = 0;
    score = 0;

    document.getElementById("quizBox").style.display = "block";

    loadQuestion();
}

/* LOAD QUESTION */
function loadQuestion(){

    clearInterval(timer);
    timeLeft = 10;

    let q = currentData[currentQuestion];

    document.getElementById("question").innerText = q.q;

    let html = "";

    q.a.forEach((opt,i)=>{
        html += `<button onclick="checkAnswer(${i})">${opt}</button><br>`;
    });

    document.getElementById("options").innerHTML = html;
    document.getElementById("result").innerText = "";

    timer = setInterval(()=>{
        document.getElementById("timer").innerText = "Time: " + timeLeft;
        timeLeft--;

        if(timeLeft < 0){
            clearInterval(timer);
            showAnswer();
            setTimeout(nextQuestion,3000); // 🔥 delay বাড়ানো
        }
    },1000);
}

/* CHECK ANSWER */
function checkAnswer(i){
    clearInterval(timer);

    let correct = currentData[currentQuestion].c;
    let buttons = document.querySelectorAll("#options button");

    // সব button disable
    buttons.forEach(btn => btn.disabled = true);

    if(i === correct){
        score += 1;

        buttons[i].style.background = "green";

        document.getElementById("result").innerText = "✔ Correct!";
    } else {

        buttons[i].style.background = "red";
        buttons[correct].style.background = "green";

        document.getElementById("result").innerText =
        "❌ Wrong! Correct: " + currentData[currentQuestion].a[correct];
    }

    document.getElementById("score").innerText = "Score: " + score;

    setTimeout(nextQuestion,3000); // 🔥 delay বাড়ানো
}

/* SHOW ANSWER */
function showAnswer(){
    let correct = currentData[currentQuestion].c;
    let buttons = document.querySelectorAll("#options button");

    buttons.forEach(btn => btn.disabled = true);

    buttons[correct].style.background = "green";

    document.getElementById("result").innerText =
    "⏰ Time Up! Correct: " + currentData[currentQuestion].a[correct];
}

/* NEXT QUESTION */
function nextQuestion(){

    currentQuestion++;

    if(score >= 50){
        alert("🎉 You Win!");
        location.reload();
        return;
    }

    if(currentQuestion >= currentData.length){
        alert("Quiz Finished! Score: " + score);
        location.reload();
        return;
    }

    loadQuestion();
}
</script>
